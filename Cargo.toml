[package]
name = "q_cam"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cubething-qproj/q_cam"

[dependencies]
bevy = "0.19"
avian3d = "0.7"
tiny_bail = "0.7"

[dev-dependencies]
q_test_harness = { git = "https://github.com/cubething-qproj/q_test_harness", version = "^0.1" }

[features]
free_camera = ["bevy/free_camera"]
dylib = ["bevy/dynamic_linking"]
default = ["dylib"]

[[example]]
name = "camera_test"
required-features = ["free_camera"]

[lints]
clippy.too_many_arguments = "allow"
clippy.type_complexity = "allow"
clippy.nonstandard_macro_braces = "warn"
